name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run test suite
        run: pytest tests/ -v

      - name: Validate swarm config (doctor)
        run: python -m automation.main doctor
        continue-on-error: true  # doctor requires persona files; may warn on CI
        env:
          OPENAI_API_KEY: "sk-placeholder-not-needed-for-doctor"

  mapppp-qualification:
    # OntoHistoCurator is private (AGPL-3.0). Ecosystem rule: no GitHub App and no
    # secret for it in this public repository. CI therefore never checks it out;
    # cross-repository qualification is run manually and offline against a pinned
    # commit (see qualification/README.md). This job only proves the qualification
    # module is reported as skipped/UNVERIFIED, never failed and never passed.
    name: mapppp-qualification (manual; UNVERIFIED in CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies (no OntoHistoCurator)
        run: |
          python -m pip install -e ".[dev]" -c constraints/test-langchain.txt
          if python -c "import ontohistoria" 2>/dev/null; then
            echo "::error::ontohistoria is importable in CI; it must only live in the manual qualification environment."
            exit 1
          fi

      - name: Collect qualification (expected skipped as UNVERIFIED)
        run: |
          set +e
          python -m pytest qualification/ -q -rs --junitxml=qualification-junit.xml
          status=$?
          set -e
          # pytest exit code 5 = no tests collected/run (module-level skip).
          if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then exit "$status"; fi
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suite = ET.parse("qualification-junit.xml").getroot()
          suite = suite if suite.tag == "testsuite" else suite.find("testsuite")
          tests, skipped = int(suite.get("tests", 0)), int(suite.get("skipped", 0))
          failures = int(suite.get("failures", 0)) + int(suite.get("errors", 0))
          assert failures == 0, f"{failures} qualification failures/errors"
          assert tests == skipped, f"{tests - skipped} qualification tests ran in CI; expected all skipped"
          PY
          msg="OntoHistoCurator cross-repository qualification: UNVERIFIED in CI (private repo not checked out). Run scripts/qualify-hcm.ps1 or scripts/qualify-hcm.sh locally; see qualification/README.md."
          echo "::warning title=Qualification UNVERIFIED::$msg"
          echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
