name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run test suite
        run: pytest tests/ -v

      - name: Validate swarm config (doctor)
        run: python -m automation.main doctor
        continue-on-error: true  # doctor requires persona files; may warn on CI
        env:
          OPENAI_API_KEY: "sk-placeholder-not-needed-for-doctor"

  mapppp-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Require read-only GitHub App credentials
        env:
          APP_CLIENT_ID: ${{ vars.ONTOHISTOCURATOR_READ_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.ONTOHISTOCURATOR_READ_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::Configure ONTOHISTOCURATOR_READ_APP_CLIENT_ID and ONTOHISTOCURATOR_READ_APP_PRIVATE_KEY for a contents:read GitHub App installed on Neuronautix/OntoHistoCurator."
            exit 1
          fi

      - uses: actions/create-github-app-token@v3
        id: ohc-token
        with:
          client-id: ${{ vars.ONTOHISTOCURATOR_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.ONTOHISTOCURATOR_READ_APP_PRIVATE_KEY }}
          owner: Neuronautix
          repositories: OntoHistoCurator
          permission-contents: read

      - uses: actions/checkout@v4
        with:
          repository: Neuronautix/OntoHistoCurator
          ref: c426705611df098256c15416ae07f084191c395e
          path: external/ontohistocurator
          token: ${{ steps.ohc-token.outputs.token }}
          persist-credentials: false

      - name: Install METODAX and pinned validator
        run: |
          test "$(git -C external/ontohistocurator rev-parse HEAD)" = c426705611df098256c15416ae07f084191c395e
          python -m pip install -e ".[dev]"
          python -m pip install ./external/ontohistocurator

      - name: Run cross-repository qualification
        run: python -m pytest qualification/ -q
