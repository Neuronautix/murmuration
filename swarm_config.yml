# ═══════════════════════════════════════════════════════════════
# swarm_config.yml — THE user-facing control surface
# ═══════════════════════════════════════════════════════════════
# This file defines EVERYTHING about your research swarm:
# personas, tools, LLM backend, reviewer constraints, and prompts.
#
# Fork this repo → edit this file → run your own domain-specific swarm.
# You should NEVER need to edit Python code to customize behavior.
#
# GETTING STARTED:
#   1. Edit the 'swarm' section below to name your swarm and set the domain.
#   2. Rename the personas to match your team (e.g., rename "Specialist1" to
#      "EpiScope" or "PolicyAnalyst").
#   3. Edit each persona's 'persona_file' path to match the new name.
#   4. Rename the corresponding folder in agents/ to match.
#   5. Populate agents/YourAgent/KB/ with domain-specific documents.
#   6. Customize the reviewer constraints for your domain's standards.
#   7. Run: make ingest && make run PROMPT="Your first research question"
#
# Or use the interactive builder:
#   python -m automation.main init
# ═══════════════════════════════════════════════════════════════

# ── Swarm Identity ───────────────────────────────────
swarm:
  name: "My-Research-Swarm"
  description: "Autonomous research swarm for [your domain]"
  output_dir: "./Drafts"
  traceability_matrix: "./Knowledge_Traceability_Matrix.md"
  # run_log:           JSON Lines record of every node update (routing reasoning,
  #                    assignments, reviewer verdicts, HITL answers, token deltas).
  #                    A file path, or false to disable (default false).
  # persist_findings:  write each specialist's findings to <output_dir>/findings/
  #                    as soon as it reports, so a crash cannot lose them (default false).
  # run_log: "./Drafts/run_log.jsonl"
  # persist_findings: true

# ── Orchestrator Settings ────────────────────────────
# Controls the multi-agent supervisor pattern.
# agent:                    persona name that acts as orchestrator (must exist in personas list)
# journalist:               persona name that writes final structured output
# max_agent_calls:          total specialist invocations before forcing Journalist
# max_tool_rounds_per_agent: tool-use loop limit inside each specialist call
# max_findings_chars:       characters of each specialist's findings shown to the
#                           orchestrator when it decides the next step (default 1500)
# max_peer_chars:           characters of each colleague's findings shown to a
#                           specialist as context (default 600). Both views are cut
#                           at a paragraph or sentence end, not mid-word
# on_agent_failure:         what to do when an agent's model call fails (default
#                           "continue": record the failure and keep the other
#                           findings; "abort": stop the run on the first error)
# allow_tools:              let the orchestrator persona use its own tools for quick
#                           checks before each routing decision, bounded by
#                           max_tool_rounds_per_agent (default false: its tools
#                           are not loaded and it only routes)
# early_stop:               {enabled, min_rounds}. When enabled, the orchestrator may
#                           declare the evidence sufficient (with a coverage note for
#                           the Journalist) and the run goes straight to the Journalist,
#                           once min_rounds specialist rounds are done (default
#                           {enabled: false, min_rounds: 1})
# max_parallel_agents:      how many specialists may run at once when the orchestrator
#                           dispatches several in parallel; the rest wait their
#                           turn (default null: no limit). Helps with rate limits.
orchestrator:
  agent: "Orchestrator"
  journalist: "Journalist"
  max_agent_calls: 8
  max_tool_rounds_per_agent: 5
  # max_findings_chars: 1500
  # max_peer_chars: 600
  # on_agent_failure: continue
  # allow_tools: false
  # max_parallel_agents: 3
  # early_stop:
  #   enabled: true
  #   min_rounds: 2

# ── LLM Backend ─────────────────────────────────────
# Supported providers: openai, anthropic, google
# Change provider and name to switch the model used by all agents.
# Use 'python -m automation.main model configure' to change this interactively.
model:
  provider: "openai"
  name: "gpt-4o"
  temperature: 0.2
  env_key: "OPENAI_API_KEY"
  # Optional: list prices used for the cost estimate in Drafts/run_metrics.json.
  # Defaults are gpt-4o list prices; set these when you change the model.
  # pricing:
  #   input_per_m: 2.50
  #   output_per_m: 10.00

# ── Personas ─────────────────────────────────────────
# Each persona has a name, icon, role description, a persona file
# loaded at runtime (the persona.md in agents/), and a list of
# tool keys (from the tools section below) they are allowed to use.
#
# To add a persona: python -m automation.main persona add
# To edit a persona: python -m automation.main persona edit
# To preview the team: python -m automation.main preview
#
# Optional per-persona model: add a `model:` block to any persona (orchestrator
# and Journalist included). It is merged over the `model:` section below, like
# reviewer.model, so give only what differs. Keys: provider, name, temperature,
# env_key. Example — a cheaper model for a narrow specialist:
#   - name: "LitScout"
#     ...
#     model:
#       name: "gpt-4o-mini"
#       temperature: 0.1
# env_key only names the variable `execute` checks; the client reads its provider's
# standard variable. Switching provider without env_key checks that provider's
# standard variable (OPENAI_API_KEY, ANTHROPIC_API_KEY or GOOGLE_API_KEY).
# The cost estimate in run_metrics.json still uses model.pricing for every token.
personas:
  - name: "Orchestrator"
    icon: "👑"
    role: "Research orchestrator — coordinates specialists, synthesizes findings, manages task decomposition"
    persona_file: "./agents/Orchestrator/persona.md"
    tools:
      - search_web
      - search_literature
      - search_kb
      - append_traceability

  - name: "Specialist1"
    icon: "🔬"
    role: "Domain specialist 1 — rename and customize for your first area of expertise"
    persona_file: "./agents/Specialist1/persona.md"
    tools:
      - search_literature
      - search_preprints
      - search_web
      - search_kb
      - scrape_page
      - you_research
      - lookup_doi

      - append_traceability
  - name: "Specialist2"
    icon: "📊"
    role: "Domain specialist 2 — rename and customize for your second area of expertise"
    persona_file: "./agents/Specialist2/persona.md"
    tools:
      - search_literature
      - search_preprints
      - search_web
      - search_kb
      - scrape_page
      - you_research
      - lookup_doi

      - append_traceability
  - name: "LitScout"
    icon: "📚"
    role: "Literature cartographer — citation chaining, landmark-paper identification, author-trail expansion"
    persona_file: "./agents/LitScout/persona.md"
    tools:
      - search_literature
      - search_preprints
      - trace_literature_network
      - lookup_doi
      - scrape_page

      - append_traceability
  - name: "Journalist"
    icon: "✍️"
    role: "Observer & Scribe — structured, neutral final output"
    persona_file: "./agents/Journalist/persona.md"
    tools:
      - write_section
      - append_traceability
      - git_snapshot

# ── Tools Registry ───────────────────────────────────
# Map logical tool names to Python module + function.
# To add a custom tool: create a Python function decorated
# with @tool, then register it here.
# Use 'python -m automation.main tools add' to add tools interactively.
tools:
  search_literature:
    module: "automation.tools"
    function: "search_pubmed"
    description: "Search PubMed for peer-reviewed biomedical literature"

  search_web:
    module: "automation.tools"
    function: "search_you_engine"
    description: "Search the live web via You.com API"

  check_schema_org:
    module: "automation.tools"
    function: "check_schema_org"
    description: "Validate terms against the Schema.org vocabulary"

  write_section:
    module: "automation.tools"
    function: "write_manuscript_section"
    description: "Write a drafted section to disk as Markdown"

  append_traceability:
    module: "automation.tools"
    function: "append_traceability_matrix"
    description: "Log a fact and its source to the Knowledge Traceability Matrix"

  search_kb:
    module: "automation.tools"
    function: "search_knowledge_base"
    description: "Search the local vectorized Knowledge Base documents"

  scrape_page:
    module: "automation.tools"
    function: "scrape_webpage"
    description: "Fetch and extract full text content from a URL"

  search_preprints:
    module: "automation.tools"
    function: "search_semantic_scholar"
    description: "Search Semantic Scholar for preprints, CHI papers, and recent publications not yet on PubMed"

  trace_literature_network:
    module: "automation.tools"
    function: "trace_literature_network"
    description: "Expand a major paper through its references and lead authors to surface adjacent literature"

  you_research:
    module: "automation.tools"
    function: "you_research"
    description: "You.com Research API: multi-step web synthesis with inline citations for a specific sub-question"

  lookup_doi:
    module: "automation.tools"
    function: "lookup_doi"
    description: "Look up full citation metadata (title, authors, DOI, abstract, OA PDF) via Europe PMC and Crossref — no API key required"

  git_snapshot:
    module: "automation.tools"
    function: "git_commit_snapshot"
    description: "Commit swarm output files (Drafts/ and traceability matrix) to git"

# ── Journalist Brief ─────────────────────────────────
# Instructions appended to the Journalist's task message on every run (and
# every revision). This is where domain-specific output requirements belong —
# mandatory sections, tables, framing rules — not in Python.
#
# The brief is a Jinja2 template. It can read any top-level key of this file
# (e.g. `reviewer`, `epistemic_tags`, or a custom `output_sections` list) plus:
#   required_elements  — reviewer.required_elements
#   tool_names         — the Journalist's tools, by function name
#   journalist_name    — the Journalist persona's name
# When omitted, the default brief lists `reviewer.required_elements` as bullets
# and tells the Journalist to save its output with its writing tool.
#
# journalist:
#   brief: |
#     Write a complete structured output. You MUST include:
#     {% for item in required_elements %}
#       • {{ item }}
#     {% endfor %}
#       • A section comparing [construct A] with [construct B]
#     Save each section with your writing tool, then create a version snapshot.

# ── Reviewer-2 (Adversarial Checkpoint) ──────────────
# The Reviewer gates all final outputs. Customize its
# constraints for your domain's epistemological standards.
#
# Use 'python -m automation.main review configure' to edit interactively.
reviewer:
  enabled: true
  max_revision_loops: 3

  # Words that trigger automatic rejection
  banned_words:
    - "groundbreaking"
    - "revolutionary"
    - "game-changing"
    - "paradigm-shifting"
    - "unprecedented"

  # Structural elements the output MUST contain
  # Customize these for your domain's reporting standards.
  required_elements:
    - "a short limitations section"
    - "in-text citations (e.g., [1], [2])"
    - "a formal 'References' or 'Reference List' section at the bottom"

  # Patterns that trigger automatic rejection
  # Add domain-specific claims that must be rejected if unsupported.
  rejection_patterns:
    - "any causal claim that is not supported by experimental or longitudinal evidence"

  # Tone enforcement
  tone: "strictly factual, objective, and neutral"

  # Optional: use a dedicated model for Reviewer-2 to create adversarial diversity.
  # Merges on top of the main model config — only override what differs.
  # Higher temperature (0.7–0.9) makes the reviewer more likely to find flaws.
  # If omitted, Reviewer-2 uses the same model as the research agents.
  #
  # ── Same provider, higher temperature ──────────────────────────────────────
  model:
    name: "gpt-4o"
    temperature: 0.8
  #
  # ── Cross-provider adversarial diversity (recommended for stronger review) ──
  # A Claude model reviewing GPT-4o agent output (or vice versa) brings
  # genuinely different training biases and response patterns to the review.
  # Uncomment and substitute credentials to enable:
  #
  # model:
  #   provider: "anthropic"
  #   name: "claude-opus-4-6"
  #   temperature: 0.8
  #   env_key: "ANTHROPIC_API_KEY"
  #
  # Or with Google Gemini as the adversarial reviewer:
  # model:
  #   provider: "google"
  #   name: "gemini-1.5-pro"
  #   temperature: 0.8
  #   env_key: "GOOGLE_API_KEY"

  # ── What happens after a rejection (all optional; defaults shown) ──────────
  # on_rejection:  journalist   — the Journalist revises alone (default)
  #                orchestrator — the orchestrator first gathers more evidence for the
  #                               rejected claims, then the Journalist revises
  #                auto         — orchestrator only when the reviewer reports missing
  #                               evidence, otherwise the Journalist
  #                With orchestrator/auto the reviewer answers in a structured form
  #                (verdict, style_issues, missing_evidence); if that fails, the
  #                APPROVED / REJECTED: text protocol is used, so custom_prompt still works.
  # max_evidence_loops: 1       — reviewer-triggered orchestrator rounds per run
  # on_max_revisions: flag      — after max_revision_loops rejections the next draft is
  #                               force-approved and flagged (default); "fail" reviews it
  #                               once more and fails the run if it is still rejected
  # context: [draft]            — what the reviewer sees; add "task" and/or "matrix"
  #                               (this run's traceability rows, to check citations)
  # matrix_excerpt_rows: 50     — matrix rows shown with context: matrix
  # on_rejection: auto
  # max_evidence_loops: 1
  # on_max_revisions: flag
  # context: [draft, task, matrix]
  # matrix_excerpt_rows: 50

  # Optional: Override the auto-generated reviewer prompt entirely.
  # Uncomment and edit to use a fully custom reviewer prompt.
  # custom_prompt: |
  #   You are a [domain] compliance reviewer. You read the agent output.
  #   If the output contains [specific violation], REJECT it.

# ── Human-in-the-Loop (HITL) Checkpoints ─────────────
# When enabled, the swarm pauses at configured points and asks the user
# a focused QC question before continuing. Uses LangGraph interrupt().
# Set enabled: false for fully autonomous runs (default behavior).
#
# Available checkpoints:
#   pre_flight      — confirm task scope before the graph starts (CLI prompt, no interrupt)
#   post_plan       — approve/redirect the orchestrator's first routing decision
#   pre_journalist  — add final framing instructions before the Journalist writes
#   on_rejection    — reviewer rejected: choose REVISE / OVERRIDE / custom instructions
hitl:
  enabled: false
  checkpoints:
    - pre_flight
    - post_plan
    - pre_journalist
    - on_rejection

# ── Checkpointer (crash and HITL resume) ─────────────
# Where LangGraph saves the run state after every step.
#   none    — nothing is saved (default when HITL is off)
#   memory  — kept in memory while the process runs (default when HITL is on)
#   sqlite  — saved to a file, so a run that crashed, was stopped with Ctrl-C, or is
#             waiting at a HITL question can be continued later from a new process:
#               python -m automation.main execute --resume <thread_id>
#             The thread id is printed when the run starts. Needs the optional extra:
#               pip install 'murmuration[persist]'
#             path defaults to ./.murmuration/checkpoints.sqlite. Keep it out of
#             output_dir: git_commit_snapshot commits that folder.
# checkpointer:
#   type: sqlite
#   path: "./.murmuration/checkpoints.sqlite"

# ── Epistemic Tags ───────────────────────────────────
# Tags used to classify knowledge claims in the traceability matrix.
# Customize these to fit your domain's epistemology.
epistemic_tags:
  - "[FACT]"
  - "[INFERENCE]"
  - "[SPECULATION]"
